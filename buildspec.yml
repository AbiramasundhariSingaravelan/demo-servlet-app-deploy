version: 0.2

phases:

  install:
    runtime-versions:
      java: corretto11

  pre_build:
    commands:
      - echo "===== Java Version ====="
      - java -version
      - echo "===== Maven Version ====="
      - mvn -version

  build:
    commands:
      - echo "===== Building HelloServlet ====="
      - mvn clean package

  post_build:
    commands:
      - echo "===== Build Completed ====="
      - ls -la target/
      - cp target/HelloServlet.war HelloServlet.war

artifacts:
  files:
    - HelloServlet.war
