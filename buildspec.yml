version: 0.2

phases:

  install:
    runtime-versions:
      java: corretto11

  pre_build:
    commands:
      - echo "Starting Maven build..."
      - java -version
      - mvn -version

  build:
    commands:
      - echo "Building Java Servlet application..."
      - mvn clean package

  post_build:
    commands:
      - echo "Build completed"
      - ls -la target/

artifacts:
  files:
    - target/HelloServlet.war
