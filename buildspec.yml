version : 0.2
phases:
  install:
      runtime-versions:
          java: corretto11
  pre_build:
      commands:
          - echo "Checking java version"
          - java -version
          - mvn -verions

  build:
      commands:
          - echo "Building application"
          - mvn clean package
  post_build:
      commands:
          - echo "Build Completed"
          - ls -la target/
  artifacts:
      files:
        -target/HelloServlet.war
